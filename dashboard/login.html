<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MitKat GrowthIQ &mdash; Login</title>
<script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <form id="login-form" class="card login-card">
    <div class="brand">
      <svg class="brand-mark" width="24" height="24" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="0.5" y="0.5" width="21" height="21" rx="6" fill="currentColor" opacity="0.14"/>
      <rect x="5" y="12" width="3" height="5" rx="1" fill="currentColor" opacity="0.55"/>
      <rect x="9.5" y="9" width="3" height="8" rx="1" fill="currentColor" opacity="0.8"/>
      <rect x="14" y="5" width="3" height="12" rx="1" fill="currentColor"/>
    </svg>
      <span class="brand-word"><span class="brand-org">MitKat</span> Growth<span class="brand-accent">IQ</span></span>
    </div>
    <p class="card-note" style="margin-bottom:1rem;">Sign in to see your own CRM data.</p>

    <label for="username" class="card-note">Username</label>
    <input type="text" id="username" autocomplete="username" required>

    <label for="password" class="card-note" style="margin-top:0.6rem;">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" id="login-submit" style="margin-top:1rem;">Sign in</button>
    <div id="login-error" class="login-error" hidden></div>
  </form>
</div>

<script src="login.js"></script>
</body>
</html>
