<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRMSurfr &mdash; Login</title>
<script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <form id="login-form" class="card login-card">
    <div class="brand">
      <svg class="brand-mark" width="24" height="24" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="0.5" y="0.5" width="21" height="21" rx="6" fill="currentColor" opacity="0.14"/>
        <path d="M3.5 13.5c1.6-3 3.4-4.5 7.5-4.5s5.9 1.5 7.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M3.5 17c1.6-2.2 3.4-3.3 7.5-3.3s5.9 1.1 7.5 3.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
      </svg>
      <span class="brand-word">CRM<span class="brand-accent">Surfr</span></span>
    </div>
    <p class="card-note" style="margin-bottom:1rem;">Sign in to see your own CRM data.</p>

    <label for="username" class="card-note">Username</label>
    <input type="text" id="username" autocomplete="username" required>

    <label for="password" class="card-note" style="margin-top:0.6rem;">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" id="login-submit" style="margin-top:1rem;">Sign in</button>
    <div id="login-error" class="login-error" hidden></div>
  </form>
</div>

<script src="login.js"></script>
</body>
</html>
